<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrcheMind 本体视图</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c2430;
    --muted: #5c6b7a;
    --line: #8b97a3;
    --hit: #c45c26;
    --paper: #f4f1ea;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  header, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
  header { padding: 28px 0 8px; }
  h1 { font-size: 28px; font-weight: 650; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0; line-height: 1.55; }
  .lead { color: var(--muted); max-width: 760px; }
  form {
    display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0;
  }
  input[type="text"] {
    flex: 1 1 280px;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid #c9c1b4;
    border-radius: 8px;
    background: white;
  }
  button {
    font: inherit;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #c9c1b4;
    background: white;
    cursor: pointer;
  }
  button.primary { background: var(--ink); color: white; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 16px; padding-bottom: 40px; }
  section {
    background: var(--card);
    border: 1px solid #e4ddd2;
    border-radius: 12px;
    padding: 16px;
  }
  .hint { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  svg { width: 100%; height: auto; display: block; }
  .hit-list { font-size: 14px; line-height: 1.6; }
  .hit-list strong { font-weight: 650; }
  .empty { color: var(--muted); }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>OrcheMind 本体视图</h1>
  <p class="lead">问题当作第一层的 Q。先在本体地图上标出命中的节点和连线；再在最低频的那一圈上看这些关系动词落在哪个角度。</p>
  <form id="ask">
    <input id="question" type="text" placeholder="输入一个问题，例如：协同性里的相离" autocomplete="off">
    <button class="primary" type="submit">分解</button>
    <button type="button" data-q="协同性里的相离">相离</button>
    <button type="button" data-q="量的单一性">单一性</button>
    <button type="button" data-q="通孔穿过焊盘">穿过</button>
  </form>
</header>
<main class="grid">
  <section>
    <h2>第一层 · 本体地图</h2>
    <p class="hint">只画 node 和 link。连线外观相同，不按类型分色。橙色是这个问题命中的部分。</p>
    <svg id="map" viewBox="0 0 980 620" role="img" aria-label="本体地图"></svg>
    <div id="hits" class="hit-list"></div>
  </section>
  <section>
    <h2>第一谐波 · 关系圆</h2>
    <p class="hint" id="circle-note">加载中。</p>
    <svg id="circle" viewBox="0 0 480 520" role="img" aria-label="关系动词在第一个正弦圆上的位置"></svg>
  </section>
</main>
<script>
const ns = "http://www.w3.org/2000/svg";

function el(name, attrs) {
  const node = document.createElementNS(ns, name);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
  return node;
}

function hitNode(node, question) {
  const text = question.trim();
  if (!text) return false;
  const name = node.name;
  if (text.includes(name) || name.includes(text)) return true;
  const code = name.split(" ")[0];
  if (code && code !== name && text.toUpperCase().includes(code.toUpperCase())) return true;
  return [...name].some((_, index) => {
    const piece = name.slice(index, index + 2);
    return piece.length === 2 && text.includes(piece) && !/^[A-Za-z]{2}$/.test(piece);
  });
}

function layout(graph) {
  const children = new Map(graph.nodes.map(node => [node.id, []]));
  const incoming = new Set();
  for (const link of graph.links) {
    if (!link.directed) continue;
    children.get(link.source_id).push(link.target_id);
    incoming.add(link.target_id);
  }
  const pos = new Map();
  const roots = graph.nodes.filter(node => !incoming.has(node.id));
  const columnWidth = 230;
  roots.forEach((root, index) => {
    const x = 80 + index * columnWidth;
    pos.set(root.id, { x, y: 36 });
    let y = 88;
    for (const childId of children.get(root.id)) {
      pos.set(childId, { x, y });
      y += 36;
      for (const grandId of children.get(childId)) {
        pos.set(grandId, { x, y });
        y += 30;
      }
    }
  });
  return pos;
}

function drawMap(graph, question) {
  const svg = document.getElementById("map");
  svg.replaceChildren();
  const pos = layout(graph);
  const point = pos;
  const matched = new Set(graph.nodes.filter(node => hitNode(node, question)).map(node => node.id));
  const matchedLinks = [];
  for (const link of graph.links) {
    const a = point.get(link.source_id);
    const b = point.get(link.target_id);
    const on = matched.has(link.source_id) && matched.has(link.target_id);
    if (on) matchedLinks.push(link);
    svg.append(el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: on && question.trim() ? "#c45c26" : "#8b97a3",
      "stroke-width": on && question.trim() ? 2.4 : 1.4,
    }));
  }
  for (const node of graph.nodes) {
    const at = point.get(node.id);
    const on = matched.has(node.id) && question.trim();
    svg.append(el("circle", {
      cx: at.x, cy: at.y, r: on ? 7 : 5,
      fill: on ? "#c45c26" : "#1c2430",
    }));
    const label = el("text", {
      x: at.x, y: at.y - 12, "text-anchor": "middle",
      "font-size": "13", fill: on ? "#c45c26" : "#1c2430",
    });
    label.textContent = node.name;
    svg.append(label);
  }
  const hits = document.getElementById("hits");
  if (!question.trim()) {
    hits.innerHTML = "<p class='empty'>还没有问题。地图上是全部节点和连线。</p>";
    return;
  }
  const nodes = graph.nodes.filter(node => matched.has(node.id));
  const names = new Map(graph.nodes.map(node => [node.id, node.name]));
  const lines = matchedLinks.map(link => `${names.get(link.source_id)} — ${names.get(link.target_id)}`);
  hits.innerHTML = nodes.length
    ? `<p><strong>命中本体</strong>：${nodes.map(node => node.name).join("、")}</p><p><strong>命中连线</strong>：${lines.join("；") || "没有"}</p>`
    : "<p class='empty'>第一层没有命中已登记的节点。穿过这类词还不在这张图上。</p>";
}

function verbDeg(verb) {
  return verb.learned_deg ?? verb.deg;
}

function drawCircle(angles, question) {
  const svg = document.getElementById("circle");
  svg.replaceChildren();
  const note = document.getElementById("circle-note");
  note.textContent = `${angles.label}，系数 ${angles.coefficient}。0° 在右侧，逆时针增加。${angles.note}`;
  const cx = 240;
  const cy = 230;
  const radius = 150;
  svg.append(el("circle", { cx, cy, r: radius, fill: "none", stroke: "#8b97a3", "stroke-width": 1.4 }));
  svg.append(el("line", { x1: cx - radius - 16, y1: cy, x2: cx + radius + 16, y2: cy, stroke: "#e4ddd2" }));
  svg.append(el("line", { x1: cx, y1: cy - radius - 16, x2: cx, y2: cy + radius + 16, stroke: "#e4ddd2" }));
  for (const verb of angles.verbs) {
    if (verb.prior_deg != null) {
      const priorRad = verb.prior_deg * Math.PI / 180;
      svg.append(el("circle", {
        cx: cx + radius * Math.cos(priorRad),
        cy: cy - radius * Math.sin(priorRad),
        r: 3, fill: "none", stroke: "#8b97a3", "stroke-width": 1,
      }));
    }
    const deg = verbDeg(verb);
    const rad = deg * Math.PI / 180;
    const x = cx + radius * Math.cos(rad);
    const y = cy - radius * Math.sin(rad);
    const on = question.trim() && (question.includes(verb.name) || question.toUpperCase().includes(verb.code.toUpperCase()) || question.includes(verb.name.split(" ").pop()));
    svg.append(el("circle", { cx: x, cy: y, r: on ? 7 : 5, fill: on ? "#c45c26" : "#1c2430" }));
    const label = el("text", {
      x: cx + (radius + 28) * Math.cos(rad),
      y: cy - (radius + 28) * Math.sin(rad),
      "text-anchor": "middle", "dominant-baseline": "middle",
      "font-size": "12", fill: on ? "#c45c26" : "#1c2430",
    });
    const delta = verb.delta_deg == null ? "" : ` Δ${verb.delta_deg.toFixed(1)}`;
    label.textContent = `${verb.code} ${deg.toFixed(1)}°${delta}`;
    svg.append(label);
  }
}

async function boot() {
  const graph = await fetch("/data/ontology_graph/v02_graph.json").then(response => response.json());
  let angles;
  const trained = await fetch("/data/ontology_graph/v03_embedding.json");
  if (trained.ok) {
    angles = await trained.json();
  } else {
    angles = await fetch("/data/rcc8/angles_f0.json").then(response => response.json());
  }
  const input = document.getElementById("question");
  const render = () => {
    drawMap(graph, input.value);
    drawCircle(angles, input.value);
  };
  document.getElementById("ask").addEventListener("submit", event => {
    event.preventDefault();
    render();
  });
  document.querySelectorAll("button[data-q]").forEach(button => {
    button.addEventListener("click", () => {
      input.value = button.dataset.q;
      render();
    });
  });
  render();
}

boot();
</script>
</body>
</html>
